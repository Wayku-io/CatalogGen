name: MDBList Auto Refresh

on:
  schedule:
    # Exécution toutes les 2 heures (à la minute 0)
    - cron: '0 */2 * * *'
  # Permet de lancer le rafraîchissement manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:

jobs:
  refresh-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run MDBList Refresh
        env:
          MDBLIST_COOKIE: ${{ secrets.MDBLIST_COOKIE }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          MDBLIST_IDS: ${{ vars.MDBLIST_IDS }}
        run: node scripts/update-mdblist.js
